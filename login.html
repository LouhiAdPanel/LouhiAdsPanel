<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirjaudu · Louhi Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark">L</span>
      <span class="brand-name">Louhi Ads</span>
    </div>
    <h1>Kirjaudu sisään</h1>
    <p class="login-lead">Mainonnanhallinnan hallintapaneeli</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Sähköposti</label>
        <input id="email" name="email" type="email" class="input" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Salasana</label>
        <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
      </div>
      <div class="form-error" id="login-error" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary login-submit">Kirjaudu sisään</button>
    </form>
    <p class="login-help">Unohtuiko salasana? Pyydä adminia asettamaan uusi.</p>
  </main>
  <script src="js/api.js?v=5"></script>
  <script src="js/login.js?v=5"></script>
</body>
</html>
